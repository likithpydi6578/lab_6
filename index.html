<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Likith Pydi | Jain University Portfolio Profile</title>

  <!-- Google Fonts: Syne (modern luxury display) & Outfit (clean neo-grotesque) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      /* ============================================================ */
      /* 🖼️ PASTE YOUR CUSTOM BACKGROUND IMAGE URL HERE:               */
      /* ============================================================ */
      --custom-bg-image: url('https://images8.alphacoders.com/136/thumb-1920-1363709.png');
      /* ============================================================ */

      --accent-cyan: #38bdf8;
      --accent-amber: #fbbf24;
      --accent-indigo: #818cf8;
      --card-bg: rgba(13, 17, 23, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      color: #f1f5f9;
      background-color: #0b0f17;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .font-syne {
      font-family: 'Syne', sans-serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-space {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Fullscreen Background Layer using CSS Variable */
    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: var(--custom-bg-image);
      transition: background-image 0.5s ease-in-out;
    }

    /* Ambient Readability Overlay with Subtle Vignette */
    #overlay-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 40%, rgba(11, 15, 23, 0.6) 0%, rgba(11, 15, 23, 0.92) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Distinctive Text Borders */
    /* 1. Name Frame with Corner Accents and Glow */
    .hero-name-card {
      position: relative;
      padding: 1.75rem 2.5rem;
      border-radius: 1.5rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 
        0 0 35px -8px rgba(56, 189, 248, 0.28),
        inset 0 0 25px -10px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(16px);
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-name-card:hover {
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 
        0 0 45px -5px rgba(56, 189, 248, 0.4),
        inset 0 0 30px -5px rgba(56, 189, 248, 0.3);
      transform: translateY(-3px);
    }

    /* 2. Technical Cyber-Bracket Border for ID */
    .bracket-tag {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.6rem;
      background: rgba(251, 191, 36, 0.08);
      border: 1px dashed rgba(251, 191, 36, 0.5);
      border-radius: 0.75rem;
      transition: all 0.3s ease;
    }

    .bracket-tag:hover {
      background: rgba(251, 191, 36, 0.14);
      border-color: rgba(251, 191, 36, 0.9);
      box-shadow: 0 0 20px -3px rgba(251, 191, 36, 0.3);
    }

    .bracket-tag::before {
      content: '[';
      position: absolute;
      left: 0.45rem;
      color: #fbbf24;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .bracket-tag::after {
      content: ']';
      position: absolute;
      right: 0.45rem;
      color: #fbbf24;
      font-weight: 700;
      font-size: 1.15rem;
    }

    /* 3. Double-Stroke Ribbon Border for University */
    .university-ribbon {
      border: 1px solid rgba(255, 255, 255, 0.22);
      outline: 2px solid rgba(255, 255, 255, 0.08);
      outline-offset: 4px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      transition: all 0.3s ease;
    }

    .university-ribbon:hover {
      outline-color: rgba(56, 189, 248, 0.5);
      border-color: rgba(56, 189, 248, 0.7);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(255, 255, 255, 0.02));
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
    }
  </style>
</head>

<body class="p-4 sm:p-6 md:p-8">

  <!-- Background layers -->
  <div id="bg-layer"></div>
  <div id="overlay-layer"></div>

  <!-- Main Showcase Container -->
  <main class="w-full max-w-3xl mx-auto my-auto flex flex-col items-center justify-center text-center">

    <!-- University Distinction Card with Double-Border -->
    <div class="mb-7">
      <div class="university-ribbon px-6 py-2.5 rounded-full inline-flex items-center space-x-3 cursor-default">
        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
        </svg>
        <span class="text-sm sm:text-base font-space font-semibold tracking-wider uppercase text-slate-100">
          Jain University
        </span>
        <span class="text-[10px] uppercase font-mono-code px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
          Student Portal
        </span>
      </div>
    </div>

    <!-- Hero Title: Likith Pydi with Glowing Neon Border -->
    <div class="mb-7 px-4">
      <div class="hero-name-card">
        <span class="block text-[11px] tracking-[0.25em] text-cyan-400 uppercase font-medium mb-2 font-mono-code">
          STUDENT IDENTITY
        </span>
        <h1 class="font-syne text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white leading-none">
          Likith Pydi
        </h1>
      </div>
    </div>

    <!-- Student Registration ID Badge with Custom Technical Brackets -->
    <div class="mb-10 flex flex-col sm:flex-row items-center justify-center gap-3">
      <div class="bracket-tag">
        <span class="font-mono-code font-bold text-lg sm:text-2xl tracking-widest text-amber-300">
          24BTRSN053
        </span>
      </div>
      <div class="text-xs text-slate-400 font-mono-code flex items-center gap-2 bg-slate-900/60 px-3.5 py-2 rounded-xl border border-slate-800">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        ACTIVE ENROLLMENT
      </div>
    </div>

    <!-- Supplemental Info Grid with Styled Micro-Borders -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-xl px-4">
      
      <div class="glass-panel p-4 rounded-xl border border-slate-700/50 hover:border-cyan-500/50 transition-colors">
        <p class="text-[11px] uppercase tracking-wider text-slate-400 font-medium">Institution</p>
        <p class="text-sm sm:text-base font-semibold text-slate-100 mt-1">Jain University</p>
      </div>

      <div class="glass-panel p-4 rounded-xl border border-slate-700/50 hover:border-amber-500/50 transition-colors">
        <p class="text-[11px] uppercase tracking-wider text-slate-400 font-medium">Roll / Reg Number</p>
        <p class="text-sm sm:text-base font-semibold text-amber-300 font-mono-code mt-1">24BTRSN053</p>
      </div>

      <div class="glass-panel p-4 rounded-xl border border-slate-700/50 hover:border-indigo-400/50 transition-colors">
        <p class="text-[11px] uppercase tracking-wider text-slate-400 font-medium">Candidate</p>
        <p class="text-sm sm:text-base font-semibold text-slate-100 mt-1">Likith Pydi</p>
      </div>

    </div>

  </main>

  <!-- Footer Note -->
  <footer class="w-full max-w-3xl mx-auto py-4 text-center text-xs text-slate-500 border-t border-slate-800/80">
    <p>Likith Pydi &bull; Jain University &bull; ID: 24BTRSN053</p>
  </footer>

</body>
</html>
